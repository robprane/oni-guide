<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

    <link rel="manifest" href="manifest.json">

</head>
<body>

                <span class="nav-link-text">Recipes</span>

            <a href="#/calculator" class="nav-link" data-route="/calculator" aria-label="Calculator" title="Calculator">
                <svg class="nav-link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M64 0C28.7 0 0 28.7 0 64V448c0 35.3 28.7 64 64 64H320c35.3 0 64-28.7 64-64V64c0-35.3-28.7-64-64-64H64zM96 64H288c17.7 0 32 14.3 32 32v32c0 17.7-14.3 32-32 32H96c-17.7 0-32-14.3-32-32V96c0-17.7 14.3-32 32-32zm32 160a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zM96 352a32 32 0 1 1 0-64 32 32 0 1 1 0 64zM64 416c0-17.7 14.3-32 32-32h96c17.7 0 32 14.3 32 32s-14.3 32-32 32H96c-17.7 0-32-14.3-32-32zM192 256a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm32 64a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zm64-64a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm32 64a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zM288 448a32 32 0 1 1 0-64 32 32 0 1 1 0 64z"/></svg>
                <span class="nav-link-text">Calculator</span>
                <span id="nav-calc-badge" class="nav-badge hidden"></span>
            </a>
            <a href="#/canvas" class="nav-link" data-route="/canvas" aria-label="Canvas" title="Canvas">

                <span class="nav-link-text">Canvas</span>
            </a>
        </div>
        <button id="settings-btn" class="nav-btn" aria-label="Settings" title="Settings">

        </button>

    <dialog id="settings-dialog" class="modal settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="close-settings-btn" class="nav-btn" aria-label="Close Settings" title="Close">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path fill="currentColor" d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                                <div class="settings-group">
                    <h3>Theme</h3>
                    <div class="theme-switcher-buttons">
                        <button id="theme-toggle-btn" class="theme-btn" aria-label="Toggle Light/Dark Theme" title="Toggle Light/Dark Theme">
                            <svg class="icon icon-circle-half" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="currentColor" d="M448 256c0-106-86-192-192-192V448c106 0 192-86 192-192zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg>
                        </button>
                        <button id="theme-system-btn" class="theme-btn" aria-label="Use System Theme" title="Use System Theme">
                            <svg class="icon icon-circle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="currentColor" d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg>
                            <svg class="icon icon-a" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path fill="currentColor" d="M221.5 51.7C216.6 39.8 204.9 32 192 32s-24.6 7.8-29.5 19.7l-120 288-40 96c-6.8 16.3 .9 35 17.2 41.8s35-.9 41.8-17.2L93.3 384H290.7l31.8 76.3c6.8 16.3 25.5 24 41.8 17.2s24-25.5 17.2-41.8l-40-96-120-288zM264 320H120l72-172.8L264 320z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Temperature</h3>
                    <div class="theme-switcher-buttons" id="unit-temp-container">
                        <button id="unit-temp-c-btn" class="theme-btn active" aria-label="Celsius" title="Celsius">
                            <span style="font-size: 1.5rem; font-weight: bold;">°C</span>
                        </button>
                        <button id="unit-temp-f-btn" class="theme-btn" aria-label="Fahrenheit" title="Fahrenheit">
                            <span style="font-size: 1.5rem; font-weight: bold;">°F</span>
                        </button>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Time</h3>
                    <div class="theme-switcher-buttons" id="unit-time-container">
                        <button id="unit-time-s-btn" class="theme-btn active" aria-label="Seconds" title="Seconds">
                            <span style="font-size: 1.2rem; font-weight: bold;">Sec</span>
                        </button>
                        <button id="unit-time-cycle-btn" class="theme-btn" aria-label="Cycles" title="Cycles">
                            <span style="font-size: 1.2rem; font-weight: bold;">Cycle</span>
                        </button>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Mass</h3>
                    <div class="theme-switcher-buttons" id="unit-mass-container">
                        <button id="unit-mass-g-btn" class="theme-btn active" aria-label="Grams" title="Grams">
                            <span style="font-size: 1.5rem; font-weight: bold;">g</span>
                        </button>
                        <button id="unit-mass-kg-btn" class="theme-btn" aria-label="Kilograms" title="Kilograms">
                            <span style="font-size: 1.5rem; font-weight: bold;">kg</span>
                        </button>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Food</h3>
                    <div class="theme-switcher-buttons" id="unit-food-container">
                        <button id="unit-food-mass-btn" class="theme-btn active" aria-label="Mass" title="Mass">
                            <span style="font-size: 1.2rem; font-weight: bold;">Mass</span>
                        </button>
                        <button id="unit-food-kcal-btn" class="theme-btn" aria-label="Kcal" title="Kcal">
                            <span style="font-size: 1.2rem; font-weight: bold;">kcal</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </dialog>

    <main id="app-content">
        <!-- Content will be dynamically injected here by the router -->
    </main>

    <script src="js/theme.js?v=3"></script>
    <script type="module" src="js/main.js?v=15"></script>
</body>
</html>
